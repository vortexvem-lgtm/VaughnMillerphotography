<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Art Gallery</title>
  <link rel="stylesheet" href="work.css">
</head>

<body>

<!-- NAV BAR -->
<header class="site-header">
  <div class="top-bar">
    <div class="logo">
      <a href="index.html">
        <img src="logo.jpg" alt="Vaughn Miller">
      </a>
    </div>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="work.html">Gallery</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<!-- HEADER -->
<section class="hero">
  <div class="hero-text">
    <h1>Photo Gallery</h1>
    <p>my latest work</p>
  </div>
</section>

<!-- FILTER BUTTONS -->
<div class="filter-buttons">
  
  <button data-filter="Portraits">Portraits</button>
  <button data-filter="Street">Street</button>
  <button data-filter="Other">other</button>
</div>

<!-- GALLERY -->
<main>
  <div class="gallery" id="gallery"></div>
</main>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
  <span id="close-lightbox">&times;</span>
  <img id="lightbox-img" src="" alt="Full view">
  <div id="lightbox-caption"></div>
</div>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="footer-content">
    <p>© 2026 Vaughn Miller</p>
    <div class="footer-links">
      <a href="work.html">Gallery</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>
</footer>

<script src="js/gallery.js"></script>

</body>
</html>
